name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" $unformatted
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Generated code is up to date
        run: |
          go run ./cmd/wayland-scanner
          git diff --exit-code
      - name: Build all commands and examples
        run: go build ./cmd/... ./example/...

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Install weston
        run: sudo apt-get update && sudo apt-get install -y weston
      - name: Start headless weston
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-test --idle-time=0 --log=/tmp/weston.log &
          for i in $(seq 1 30); do
            if [ -S "$XDG_RUNTIME_DIR/wayland-test" ]; then
              echo "weston headless is up"
              exit 0
            fi
            sleep 1
          done
          echo "weston failed to start"
          cat /tmp/weston.log
          exit 1
      - name: Integration tests against weston
        env:
          WAYLAND_DISPLAY: wayland-test
        run: go test -tags=integration -count=1 -run TestIntegration -v ./...
